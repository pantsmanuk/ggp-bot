[project]
name = "ggp-bot"
version = "0.5.4"
description = "GGP Slack bot for intranet and Jenkins integration"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=42.0",
]

[project.scripts]
ggp-bot = "ggp_bot.main:main_sync"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
